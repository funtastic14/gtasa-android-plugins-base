
name: Build and Release

on:
  push:
    branches:
      - master 
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build Mod with ndk-build
        run: |
          ndk-build -B V=1 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk NDK_DEBUG=0

      - name: Prepare Release Binaries
        run: |
          cp libs/arm64-v8a/libVehicleLEDSystem.so ./libVehicleLEDSystem-arm64-v8a.so
          cp libs/armeabi-v7a/libVehicleLEDSystem.so ./libVehicleLEDSystem-armeabi-v7a.so

      - name: Package VLS in-game test bundle
        run: |
          mkdir -p package/VehicleLEDSystem/fonts package/VehicleLEDSystem/textures
          cp libVehicleLEDSystem-arm64-v8a.so package/
          cp libVehicleLEDSystem-armeabi-v7a.so package/
          cp assets/fonts/*.vlsfont package/VehicleLEDSystem/fonts/
          cp assets/textures/*.ppm package/VehicleLEDSystem/textures/
          cp assets/fonts/README.md package/VehicleLEDSystem/fonts/
          cp assets/textures/README.md package/VehicleLEDSystem/textures/
          cd package && zip -r ../VehicleLEDSystem-test-package.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            libVehicleLEDSystem-arm64-v8a.so
            libVehicleLEDSystem-armeabi-v7a.so
            VehicleLEDSystem-test-package.zip
          generate_release_notes: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: VehicleLEDSystem-test-bundle
          path: |
            libVehicleLEDSystem-arm64-v8a.so
            libVehicleLEDSystem-armeabi-v7a.so
            VehicleLEDSystem-test-package.zip
